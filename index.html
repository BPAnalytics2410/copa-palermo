<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copa Palermo · Primera Edición</title>
<meta name="description" content="Control del campeonato: tabla de posiciones, goleadores, tarjetas, calendario y fases finales.">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --bg2:#0b111b; --panel:#0f1724; --panel2:#162133; --line:#243049;
  --verde:#2fbdf0; --verde-d:#1b7fa8; --ambar:#f2c230; --rojo:#e0453c;
  --txt:#e9f0fa; --muted:#8ea0ba; --white:#fff;
  --r:14px; --sh:0 2px 14px rgba(0,0,0,.45);
  --cond:'Barlow Condensed',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;
  background:
    radial-gradient(900px 500px at 15% -10%,rgba(47,189,240,.16),transparent 60%),
    radial-gradient(700px 400px at 95% 0%,rgba(242,194,48,.10),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 34px,transparent 34px 68px)}
a{color:var(--verde)}
h1,h2,h3,h4{margin:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.02em;font-weight:700;line-height:1.1}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(5,8,13,.96),rgba(5,8,13,.82));border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;flex:0 0 54px;border-radius:50%;overflow:hidden;border:2px solid var(--verde);
  box-shadow:0 0 0 4px rgba(47,189,240,.12);background:#000}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1;min-width:0}
.brand h1{font-size:clamp(20px,4.6vw,30px);color:var(--white)}
.brand h1 em{font-style:normal;color:var(--ambar)}
.brand p{margin:1px 0 0;font-family:var(--cond);font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
nav{max-width:1180px;margin:0 auto;padding:0 10px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:0;color:var(--muted);font-family:var(--cond);font-size:16px;
  text-transform:uppercase;letter-spacing:.06em;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--txt);background:var(--panel)}
nav button.on{background:var(--verde);color:#031622;font-weight:700}

/* ---------- BASE UI ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;font-family:var(--cond);font-size:15px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.btn:hover{border-color:var(--verde);color:var(--white)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#031622;font-weight:700}
.btn.amb{background:var(--ambar);border-color:var(--ambar);color:#2a2000;font-weight:700}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.gh{background:transparent}
select,input,textarea{background:#0a0f18;color:var(--txt);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-family:var(--sans);font-size:13px;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--verde)}
/* fecha y hora: que el icono se vea y que el campo entero abra el selector */
input[type="date"],input[type="time"]{cursor:pointer;font-variant-numeric:tabular-nums}
input[type="date"]:hover,input[type="time"]:hover{border-color:var(--verde)}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  filter:invert(1) brightness(1.8);opacity:.8;cursor:pointer;
  width:17px;height:17px;padding:0;margin-left:4px}
input[type="date"]:hover::-webkit-calendar-picker-indicator,
input[type="time"]:hover::-webkit-calendar-picker-indicator{opacity:1}
input[type="date"]::-webkit-datetime-edit,
input[type="time"]::-webkit-datetime-edit{color:var(--txt)}
input[type="date"]:invalid::-webkit-datetime-edit,
input[type="time"]:invalid::-webkit-datetime-edit{color:var(--muted)}
label{display:block;font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>h2,.card>h3{padding:12px 16px;border-bottom:1px solid var(--line);font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>h2 .sub,.card>h3 .sub{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.pad{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 150px;min-width:120px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--cond);font-size:12px;text-transform:uppercase;letter-spacing:.07em;
  padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.v{background:rgba(47,189,240,.14);border-color:rgba(47,189,240,.4);color:var(--verde)}
.tag.a{background:rgba(242,194,48,.14);border-color:rgba(242,194,48,.4);color:var(--ambar)}
.tag.r{background:rgba(224,69,60,.14);border-color:rgba(224,69,60,.4);color:#ff8b83}
.hide{display:none!important}

/* ---------- STATS ---------- */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--verde)}
.stat.a::after{background:var(--ambar)}
.stat.r2::after{background:var(--rojo)}
.stat .n{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1;color:var(--white)}
.stat .l{font-family:var(--cond);font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-top:3px}

/* ---------- TABLES ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}
th{font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.028)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
td.b{font-weight:600;color:var(--white)}
.pos{width:30px;text-align:center;font-family:var(--cond);font-size:16px;color:var(--muted)}
tr.clasif td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
tr.clasif .pos{color:var(--verde);font-weight:700}
.pts{font-family:var(--cond);font-size:18px;font-weight:700;color:var(--ambar)}
.dg-p{color:var(--verde)}.dg-n{color:#ff8b83}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:9px;font-weight:700;
  display:grid;place-items:center;color:#031622}
.form i.G{background:var(--verde)}.form i.E{background:#7b8aa3}.form i.P{background:var(--rojo);color:#fff}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px}
.badge.am{background:var(--ambar);color:#2a2000}
.badge.ro{background:var(--rojo);color:#fff}

/* ---------- MATCH ROWS ---------- */
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.mt:last-child{border-bottom:0}
.mt .t1{text-align:right}.mt .t2{text-align:left}
.mt .eq{font-weight:600;color:var(--white);font-size:13px}
.mt .sc{font-family:var(--cond);font-size:19px;font-weight:700;background:#060a11;border:1px solid var(--line);
  border-radius:8px;padding:2px 11px;min-width:62px;text-align:center;white-space:nowrap}
.mt .sc.pend{font-size:12px;color:var(--muted);letter-spacing:.06em}
.mt .win{color:var(--verde)}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:var(--panel2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.jhead h4{font-size:15px;color:var(--ambar)}
.jhead span{font-size:11px;color:var(--muted)}

/* ---------- MATRIZ ---------- */
.mx{font-size:11px;border-collapse:separate;border-spacing:2px;width:auto;min-width:0}
.mx th{padding:3px;font-size:10px;background:transparent}
.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:88px;text-align:left}
.mx td{padding:0;border:0;width:26px;height:24px;text-align:center;border-radius:4px}
.mx td.self{background:#060a11}
.mx td.done{background:rgba(47,189,240,.22);color:var(--verde);font-weight:700;font-size:10px}
.mx td.prog{background:rgba(242,194,48,.2);color:var(--ambar)}
.mx td.todo{background:rgba(255,255,255,.05);color:#4a566b}
.mx td.todo:hover{background:rgba(47,189,240,.3);cursor:pointer;color:var(--white)}
.mx .name{text-align:right;white-space:nowrap;color:var(--muted);padding-right:6px!important;font-size:11px}

/* ---------- BRACKET ---------- */
.brk{display:flex;gap:26px;overflow-x:auto;padding:6px 2px 14px}
.brk .col{flex:0 0 220px;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.brk .col>h4{font-size:13px;color:var(--muted);text-align:center;margin-bottom:2px}
.tie{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tie .s{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:12px}
.tie .s+.s{border-top:1px solid var(--line)}
.tie .s b{color:var(--white);font-weight:600}
.tie .s.w{background:rgba(47,189,240,.1)}
.tie .s.w b{color:var(--verde)}
.tie .s .g{font-family:var(--cond);font-size:16px;font-weight:700}
.tie .lbl{background:#060a11;color:var(--muted);font-family:var(--cond);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 10px}

/* ---------- MODAL / TOAST ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-width:560px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--verde);color:#031622;
  font-weight:700;padding:11px 20px;border-radius:999px;z-index:100;box-shadow:var(--sh);font-size:13px}
/* pantalla que bloquea todo mientras se guarda en el Sheet */
.bloq{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:20px}
.bloq .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 32px;
  text-align:center;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.65)}
.bloq .sp{width:46px;height:46px;margin:0 auto 18px;border:4px solid var(--line);
  border-top-color:var(--verde);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.bloq .ic{font-size:46px;line-height:1;margin-bottom:12px}
.bloq h3{font-size:22px;color:var(--white);margin-bottom:8px}
.bloq p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.bloq.ok h3{color:var(--verde)}
.bloq.err h3{color:#ff8b83}
.bloq .btn{margin-top:18px}
.warn{background:rgba(242,194,48,.1);border:1px solid rgba(242,194,48,.35);border-radius:10px;padding:10px 13px;font-size:12.5px}
.warn b{color:var(--ambar)}
.iq{margin-left:auto;flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;
  display:grid;place-items:center;padding:0}
.iq:hover{border-color:var(--ambar);color:var(--ambar)}
.iq.on{background:var(--ambar);border-color:var(--ambar);color:#2a2000}
.ayuda{margin:0;padding:11px 16px;background:rgba(242,194,48,.07);border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}
.ayuda b{color:var(--ambar)}
footer{max-width:1180px;margin:0 auto;padding:22px 16px 40px;color:var(--muted);font-size:11.5px;
  border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
code{background:#060a11;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11.5px}
@media(max-width:640px){
  .hwrap{padding:9px 12px;gap:10px;flex-wrap:wrap}
  .logo{width:42px;height:42px;flex-basis:42px}
  .brand h1{font-size:23px;white-space:nowrap}
  .brand p{font-size:11px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtns{flex:1 1 100%;justify-content:stretch;gap:6px}
  .hbtns .btn{flex:1 1 0;text-align:center}
  nav button{font-size:15px;padding:7px 11px}
  .mh{display:none}
  th,td{padding:7px 5px}
  main{padding:14px 11px 60px}.pad{padding:12px}
  .mt{grid-template-columns:1fr auto 1fr;gap:6px;padding:8px 9px}
  .mt .eq{font-size:12px}.hbtns .btn{font-size:13px;padding:6px 9px}
}
@media print{
  body::before,nav,.hbtns,.noprint{display:none!important}
  body{background:#fff;color:#000}.card{border-color:#bbb;box-shadow:none}
  th,td{color:#000}
}
</style>
</head>

<script>
/* ============================================================
   COPA PALERMO — control de campeonato
   Fuente de datos: Google Sheets publicado (o data/campeonato.json)

/* ══════════════════════════════════════════════════════════════════════════
   CONEXIÓN CON EL GOOGLE SHEET DEL CAMPEONATO
   Lo único que se cambia acá si algún día se usa otro Sheet.
   ══════════════════════════════════════════════════════════════════════════ */

/* El Sheet de donde se leen todos los datos (debe estar compartido como
   "cualquier persona con el enlace" → Lector). */
const SHEET_ID = '1MiHemcU2rmKQhyEkXJqwqwxHvhc_yDXLjg8NVHcO07g';

/* Para poder ESCRIBIR (registrar goleadores, tarjetas, subir partidos):
   pegá acá la URL del Apps Script publicado, la que termina en /exec.
   Si queda vacío, la página solo lee y genera las filas para copiar y pegar. */
const API_URL   = 'https://script.google.com/macros/s/AKfycbx0Ufzp4C4KcuPqk1Kw55p-M17fZ4NZ4sdOt90aqnkVT-MfsC0iKxtTQ8XX1CgMhJlJAA/exec';
const API_TOKEN = 'palermo2026';

/* ══════════════════════════════════════════════════════════════════════════ */

const SHEETS = ['CONFIG','EQUIPOS','PARTIDOS','GOLES','TARJETAS','PAGOS'];
const CATS   = ['GRUPO A','GRUPO B'];
const FASES  = ['OCTAVOS','CUARTOS','SEMIFINAL','TERCER PUESTO','FINAL'];
const LS_DRAFT = 'cp_borrador';

const S = {
  cfg:{}, equipos:[], partidos:[], goles:[], tarjetas:[], pagos:[],
  origen:'', tab:'resumen', borrador:[], filtros:{},
  golesNuevos:[], tarjNuevas:[], pagosNuevos:[], editPartidos:{}, editPagos:{}, guardando:false
};

/* ---------- utils ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const up = s => String(s==null?'':s).replace(/\s+/g,' ').trim().toUpperCase();
/* Convierte a número tolerando lo que devuelve Google Sheets: "$7.00",
   "1.234,50", "3,5", " 12 ", etc. Si no hay número, da 0.                    */
const num = v => {
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  let s = String(v == null ? '' : v).trim();
  if (!s) return 0;
  const neg = /^\(.*\)$/.test(s) || s.indexOf('-') === 0;   /* (100) o -100 */
  s = s.replace(/[^\d.,]/g, '');
  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if (c > -1 && p > -1) {
    /* el separador que va último es el decimal */
    s = (c > p) ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (c > -1) {
    const partes = s.split(',');
    /* "1,234" son miles; "3,5" es decimal */
    s = (partes.length === 2 && partes[1].length === 3) ? s.replace(/,/g, '') : s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
};

function fechaTxt(f){
  if(!has(f)) return '';
  const m = String(f).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  let d;
  if(m) d = new Date(+m[1],+m[2]-1,+m[3]);
  else { const p = String(f).split(/[\/\-]/); if(p.length===3){ const a=p[2].length===4?+p[2]:2000+ +p[2]; d=new Date(a,+p[1]-1,+p[0]); } }
  if(!d||isNaN(d)) return String(f);
  return d.toLocaleDateString('es-EC',{weekday:'short',day:'2-digit',month:'short'});
}
function fechaISO(f){
  if(!has(f)) return '';
  const m=String(f).trim().match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const p=String(f).split(/[\/\-]/);
  if(p.length===3){ const a=p[2].length===4?p[2]:'20'+p[2];
    return a+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0'); }
  return '';
}
const corto = e => String(e||'').replace(/^F\.\s*/,'');

/* Normaliza la hora a HH:MM. Google devuelve "9:00", "9:00:00" o "9:00 a. m."
   y el campo de hora del navegador necesita exactamente HH:MM.               */
/* 20:00 -> "8:00 PM"  ·  09:00 -> "9:00 AM" */
function hora12(h){
  const m=String(h||'').match(/^(\d{1,2}):(\d{2})/);
  if(!m) return String(h||'');
  let hh=+m[1];
  const ap = hh>=12 ? 'PM' : 'AM';
  hh = hh%12 || 12;
  return hh+':'+m[2]+' '+ap;
}
function horaISO(h){
  if(!has(h)) return '';
  const s=String(h).trim().toUpperCase();
  const m=s.match(/(\d{1,2})\s*[:.hH]\s*(\d{2})/) || s.match(/^(\d{1,2})$/);
  if(!m) return '';
  let hh=+m[1], mm=m[2]?+m[2]:0;
  if(/P\.?\s?M/.test(s) && hh<12) hh+=12;
  if(/A\.?\s?M/.test(s) && hh===12) hh=0;
  if(hh>23||mm>59) return '';
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

/* ---------- CSV ---------- */
function parseCSV(txt){
  const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function csvToObjs(txt){
  const rows=parseCSV(txt); if(!rows.length) return [];
  const head=rows[0].map(h=>up(h).replace(/\s+/g,'_'));
  return rows.slice(1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=r[i]===undefined?'':String(r[i]).trim()); return o; });
}

async function apiPost(payload){
  const url=apiURL();
  if(!url) throw new Error('Falta configurar el Web App del Sheet');
  await fetch(url,{ method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},

}
const esperar = ms => new Promise(r=>setTimeout(r,ms));

/* Guarda filas en una hoja y verifica releyendo. verificar(S) => true si llegó */
async function guardarEnSheet(hoja,rows,verificar,etiqueta){
  if(S.guardando) return false;
  S.guardando=true;
  bloqAbrir('Guardando en el Sheet…',
    rows.length+' fila'+(rows.length>1?'s':'')+' en la hoja '+hoja+'. No toques nada hasta que termine.');
  try{
    await apiPost({action:'append',hoja,rows});
    bloqTexto('Verificando…','Estoy releyendo el Sheet para confirmar que llegó todo.');
    let ok=false;
    for(let intento=1;intento<=4&&!ok;intento++){
      await esperar(intento===1?2400:2500);
      await cargar();
      ok=verificar();
      if(!ok&&intento<4) bloqTexto('Verificando…','El Sheet todavía no lo refleja. Reintento '+intento+' de 3.');
    }
    render();
    if(ok) bloqFin(true,(etiqueta||'Guardado')+' con éxito',
      rows.length+' fila'+(rows.length>1?'s':'')+' quedaron en la hoja '+hoja+'.');
    else bloqFin(false,'No se guardó',
      'Las filas no aparecen en el Sheet. Volvé a intentar; si sigue igual, revisá que el Apps Script siga publicado.');
    return ok;
  }catch(e){
    bloqFin(false,'No se pudo guardar',e.message);
    return false;
  }finally{ S.guardando=false; }
}

async function cargar(){

async function cargarSheets(id){
  /* headers=1 es clave: sin eso Google adivina y a veces junta varias filas
     como encabezado (lo hacía con la hoja CONFIG).                           */
  const url = n => 'https://docs.google.com/spreadsheets/d/'+id+
    '/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(n);
  const res = await Promise.all(SHEETS.map(n=>fetch(url(n)).then(r=>{ if(!r.ok) throw new Error(n); return r.text(); })));
  const map = {};
  SHEETS.forEach((n,i)=>map[n]=csvToObjs(res[i]));
  S.cfg = {};
  (map.CONFIG||[]).forEach(r=>{ if(has(r.CLAVE)) S.cfg[up(r.CLAVE)] = r.VALOR; });
  S.equipos=map.EQUIPOS||[]; S.partidos=map.PARTIDOS||[]; S.goles=map.GOLES||[];
  S.tarjetas=map.TARJETAS||[]; S.pagos=map.PAGOS||[];
  normalizar();
}

    .map(e=>({categoria:cat(e.CATEGORIA),equipo:up(e.EQUIPO),delegado:e.DELEGADO||'',tel:e.TELEFONO||'',

  S.partidos = S.partidos.filter(p=>has(p.LOCAL)&&has(p.VISITA)).map(p=>{
    const est=up(p.ESTADO)||'PENDIENTE', gl=p.GL, gv=p.GV;

    return { id:up(p.ID), categoria:cat(p.CATEGORIA), fase:up(p.FASE)||'GRUPOS', jornada:num(p.JORNADA)||'',
      fecha:fechaISO(p.FECHA), hora:horaISO(p.HORA), cancha:String(p.CANCHA||'').trim(),
      local:up(p.LOCAL), visita:up(p.VISITA),
      gl:has(gl)?num(gl):null, gv:has(gv)?num(gv):null,
      estado:est, jugado:jug&&has(gl)&&has(gv), obs:p.OBS||'' };
  });
  S.goles = S.goles.filter(g=>has(g.JUGADOR)&&num(g.GOLES)>0).map(g=>({

  S.tarjetas = S.tarjetas.filter(t=>has(t.JUGADOR)).map(t=>({
    pid:up(t.PARTIDO_ID), categoria:cat(t.CATEGORIA), equipo:up(t.EQUIPO), jugador:up(t.JUGADOR),

  S.pagos = S.pagos.filter(p=>has(p.EQUIPO)).map(p=>({
    categoria:cat(p.CATEGORIA), equipo:up(p.EQUIPO), concepto:up(p.CONCEPTO)||'OTRO',
    /* La 4ª columna de PAGOS se usa como jornada. Sirve igual si el encabezado
       del Sheet dice CUOTA (como vino del Excel) o si lo renombrás a JORNADA. */
    cuota:String(p.JORNADA!==undefined&&p.JORNADA!==''?p.JORNADA:(p.CUOTA||'')).trim(),
    fecha:fechaISO(p.FECHA), valor:num(p.VALOR), obs:p.OBS||'' }));
}

const PV = ()=>num(S.cfg.PTS_VICTORIA)||3;
const PE = ()=>num(S.cfg.PTS_EMPATE)||1;
const clasN = c => num(c==='FEMENINO'? (S.cfg.CLASIFICAN_FEMENINO||S.cfg.CLASIFICAN_POR_GRUPO) : S.cfg.CLASIFICAN_POR_GRUPO)||4;
const equiposDe = c => S.equipos.filter(e=>e.categoria===c&&e.activo).map(e=>e.equipo);
const partidosDe = (c,fase) => S.partidos.filter(p=>p.categoria===c&&(fase?p.fase===fase:true));

function tabla(cat){
  const T={};
  equiposDe(cat).forEach(e=>T[e]={equipo:e,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,form:[],h2h:{}});
  const get = e => T[e] || (T[e]={equipo:e,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,form:[],h2h:{},extra:true});
  partidosDe(cat,'GRUPOS').filter(p=>p.jugado).sort((a,b)=>(a.jornada||0)-(b.jornada||0)).forEach(p=>{
    const a=get(p.local), b=get(p.visita);
    a.pj++;b.pj++; a.gf+=p.gl;a.gc+=p.gv; b.gf+=p.gv;b.gc+=p.gl;
    a.h2h[b.equipo]=(a.h2h[b.equipo]||0); b.h2h[a.equipo]=(b.h2h[a.equipo]||0);
    if(p.gl>p.gv){ a.pg++;b.pp++; a.pts+=PV(); a.form.push('G'); b.form.push('P'); a.h2h[b.equipo]+=PV(); }
    else if(p.gl<p.gv){ b.pg++;a.pp++; b.pts+=PV(); b.form.push('G'); a.form.push('P'); b.h2h[a.equipo]+=PV(); }
    else { a.pe++;b.pe++; a.pts+=PE(); b.pts+=PE(); a.form.push('E'); b.form.push('E');
           a.h2h[b.equipo]+=PE(); b.h2h[a.equipo]+=PE(); }
  });
  const h2h = (x,y) => (y.h2h[x.equipo]||0)-(x.h2h[y.equipo]||0);
  return Object.values(T).map(t=>({...t,dg:t.gf-t.gc})).sort((x,y)=>
    desempateEntreEllos()
      ? (y.pts-x.pts || h2h(x,y) || y.dg-x.dg || y.gf-x.gf || x.equipo.localeCompare(y.equipo))
      : (y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || h2h(x,y) || x.equipo.localeCompare(y.equipo)));
}
const desempateEntreEllos = () => up(S.cfg.DESEMPATE).indexOf('ENTRE')===0;

/* ---------- nombres de jugadores ----------
   "josé muñoz", "JOSE MUNOZ" y "Jose  Muñoz" son la misma persona: se agrupan
   por una clave sin tildes, sin dobles espacios y en mayúsculas.             */
const clave = s => up(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const claveOrden = s => clave(s).split(' ').sort().join(' ');   /* apellido/nombre invertidos */

function distancia(a,b){                       /* Levenshtein simple, para detectar tipeos */
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>3) return 9;
  const m=[];
  for(let i=0;i<=a.length;i++) m[i]=[i];
  for(let j=0;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
/* Todos los jugadores conocidos de un equipo, con su clave.
   fuente: 'GOLES' o 'TARJETAS' para mirar una sola hoja; vacío = las dos.   */
function planteles(equipo,fuente){
  const M={};
  const add=(j)=>{ const k=clave(j); if(!k) return;
    if(!M[k]) M[k]={clave:k,nombre:j,usos:0}; M[k].usos++; };
  if(fuente!=='TARJETAS') S.goles.filter(g=>!equipo||g.equipo===equipo).forEach(g=>add(g.jugador));
  if(fuente!=='GOLES') S.tarjetas.filter(t=>!equipo||t.equipo===equipo).forEach(t=>add(t.jugador));
  return M;
}
/* Devuelve el nombre oficial si ya existe, o un parecido para preguntar */
function resolverJugador(equipo,escrito,fuente){
  const k=clave(escrito);
  const M=planteles(equipo,fuente);
  if(M[k]) return {nombre:M[k].nombre,exacto:true};
  const ko=claveOrden(escrito);
  const lista=Object.values(M);
  let cand=lista.find(p=>claveOrden(p.nombre)===ko);                    /* orden invertido */
  if(!cand) cand=lista.find(p=>distancia(clave(p.nombre),k)<=2);        /* tipeo */
  return {nombre:up(escrito),exacto:false,parecido:cand?cand.nombre:null};
}

function goleadores(cat,equipo){
  const M={};
  S.goles.filter(g=>(!cat||g.categoria===cat)&&(!equipo||g.equipo===equipo)).forEach(g=>{
    const k=g.categoria+'|'+g.equipo+'|'+clave(g.jugador);
    if(!M[k]) M[k]={categoria:g.categoria,equipo:g.equipo,jugador:g.jugador,goles:0,partidos:new Set(),variantes:new Set()};
    M[k].goles+=g.goles; M[k].partidos.add(g.pid||('J'+g.jornada)); M[k].variantes.add(g.jugador);
  });
  return Object.values(M).map(x=>({...x,pj:x.partidos.size,vs:[...x.variantes]}))
    .sort((a,b)=>b.goles-a.goles||b.pj-a.pj||a.jugador.localeCompare(b.jugador));
}
function fairplay(cat){
  const M={};
  S.tarjetas.filter(t=>!cat||t.categoria===cat).forEach(t=>{
    const k=t.categoria+'|'+t.equipo+'|'+clave(t.jugador);
    if(!M[k]) M[k]={...t,am:0,ro:0};
    M[k].am+=t.am; M[k].ro+=t.ro;
  });
  return Object.values(M).sort((a,b)=>(b.ro*3+b.am)-(a.ro*3+a.am)||a.jugador.localeCompare(b.jugador));
}
function pares(cat){                       /* todos los cruces posibles y su estado */
  const eqs = equiposDe(cat), out=[];
  const cruce = (p,a,b)=>(p.local===a&&p.visita===b)||(p.local===b&&p.visita===a);
  for(let i=0;i<eqs.length;i++) for(let j=i+1;j<eqs.length;j++){
    const a=eqs[i],b=eqs[j];
    const ps = partidosDe(cat,'GRUPOS').filter(p=>cruce(p,a,b));
    const bo = S.borrador.filter(p=>p.categoria===cat&&p.fase==='GRUPOS'&&cruce(p,a,b));
    out.push({a,b,jugados:ps.filter(p=>p.jugado),agendados:ps.filter(p=>!p.jugado).concat(bo),
              partidos:ps.concat(bo),borrador:bo});
  }
  return out;
}

}

  if(extra) d.push(extra);
  return d.filter(has).join(' · ');
}

/* nombres oficiales del equipo, sin repetidos por tildes ni mayúsculas */
function jugadoresDe(equipo,fuente){
  return Object.values(planteles(equipo,fuente)).map(p=>p.nombre).sort();
}
/* partidos ordenados para cargar datos: primero los que tienen goles sin asignar */
function partidosParaCarga(){
  const falta={};
  golesSinAsignar().forEach(x=>falta[x.p.id]=x.falta);
  return S.partidos.slice().sort((a,b)=>
    (falta[b.id]||0)-(falta[a.id]||0) || (b.jornada||0)-(a.jornada||0) || String(b.id).localeCompare(a.id))
    .map(p=>({p,falta:falta[p.id]||0}));
}
/* soloFaltan: deja solo los partidos a los que les faltan goleadores, para no
   tener que bajar por una lista de 60 que ya están completos.                */
function selPartido(id,sel,soloFaltan){
  let lista=partidosParaCarga();
  if(soloFaltan && S.filtros.rgTodos!=='1'){
    const f=lista.filter(x=>x.falta>0||x.p.id===sel);
    if(f.length) lista=f;
  }
  return '<select id="'+id+'">'+lista.map(x=>{
    const p=x.p;
    const marca = !p.jugado ? '  ·  sin marcador'
      : x.falta>0 ? '  ⚠ faltan '+x.falta+' goles'
      : '  ✓ completo';
    return '<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+
      esc(p.id)+' · '+p.categoria.replace('GRUPO ','G').replace('FEMENINO','FEM')+' J'+p.jornada+' · '+
      esc(corto(p.local))+(p.jugado?' '+p.gl+'-'+p.gv+' ':' vs ')+esc(corto(p.visita))+
      marca+'</option>';
  }).join('')+'</select>';
}

/* Avisa de nombres que parecen el mismo jugador escrito distinto */
function cardNombresParecidos(fuente){
  const pares=nombresParecidos(fuente);
  if(!pares.length) return '';
  /* Dice qué tiene registrado ese nombre y EN QUÉ HOJA está, que es lo que
     hace falta saber para ir a corregirlo.                                   */
  const ficha=(eq,jug)=>{
    const k=clave(jug);
    const g=S.goles.filter(x=>x.equipo===eq&&clave(x.jugador)===k).reduce((s,x)=>s+x.goles,0);
    const t=S.tarjetas.filter(x=>x.equipo===eq&&clave(x.jugador)===k);
    const am=t.reduce((s,x)=>s+x.am,0), ro=t.reduce((s,x)=>s+x.ro,0);
    const datos=[]; if(g) datos.push(g+(g>1?' goles':' gol'));
    if(am) datos.push(am+' 🟨'); if(ro) datos.push(ro+' 🟥');
    const hojas=[]; if(g) hojas.push('GOLES'); if(t.length) hojas.push('TARJETAS');
    return '<div class="b">'+esc(jug)+'</div>'+
      '<div class="muted" style="font-size:11px">'+(datos.join(' · ')||'sin registros')+
      (hojas.length? ' · en <code>'+hojas.join('</code> + <code>')+'</code>' : '')+'</div>';
  };
  return '<div class="card noprint" style="margin-bottom:14px"><h2>⚠ Nombres parecidos '+
    '<span class="sub">'+pares.length+' por revisar</span>'+botonAyuda('apDup')+'</h2>'+
    ayuda('apDup','Al cargar, la página ya te avisa si un nombre se parece a uno que existe. '+
      'Estos son los que <b>ya estaban cargados</b> de antes, y la mayoría vienen de la planilla de '+
      'tarjetas del Excel viejo. Debajo de cada nombre dice <b>en qué hoja está</b>. Si son la misma '+
      'persona: abrí esa hoja, seleccioná la columna <b>JUGADOR</b> y usá <b>Editar → Buscar y '+
      'reemplazar</b>. Si son dos jugadores distintos (hermanos, por ejemplo), no toques nada.')+
    '<div class="tw"><table><thead><tr><th>Equipo</th><th>Un nombre</th><th>El otro</th>'+
    '</tr></thead><tbody>'+
    pares.map(x=>'<tr><td><span class="tag">'+esc(corto(x.equipo))+'</span></td>'+
      '<td>'+ficha(x.equipo,x.a)+'</td><td>'+ficha(x.equipo,x.b)+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="pad muted" style="font-size:11.5px">Corregí el nombre en la hoja que se indica y la '+
    'tabla se recalcula sola. Si son jugadores distintos, dejalo así.</div></div>';
}

function tabGoleadores(){
  const cat = S.filtros.gcat||'', q = S.filtros.gq||'';
  let L = goleadores(cat||null);
  if(q) L = L.filter(g=>g.jugador.indexOf(up(q))>=0||g.equipo.indexOf(up(q))>=0);
  const totCat = c => S.goles.filter(g=>g.categoria===c).reduce((s,g)=>s+g.goles,0);
  const porEquipo = {};
  S.goles.filter(g=>!cat||g.categoria===cat).forEach(g=>{
    const k=g.categoria+'|'+g.equipo;
    if(!porEquipo[k]) porEquipo[k]={categoria:g.categoria,equipo:g.equipo,goles:0};
    porEquipo[k].goles+=g.goles;

  const eqTop = Object.values(porEquipo).sort((a,b)=>b.goles-a.goles).slice(0,10);

  return cardRegistroGoles()+cardEstadoCarga()+cardNombresParecidos('GOLES')+

    /* Hombres y femenino van en tablas separadas: son premios distintos.

      (cat?'':'<td><span class="tag">'+e.categoria.replace('GRUPO ','').replace('FEMENINO','FEM')+'</span></td>')+
      '<td class="n"><span class="pts">'+e.goles+'</span></td></tr>').join('')+

const amParaSusp = () => num(S.cfg.AMARILLAS_SUSPENSION)||3;

/* Rojas pendientes de cumplir + jugadores que llegaron al tope de amarillas */
function suspendidos(cat){
  const out=[];
  S.tarjetas.filter(t=>(!cat||t.categoria===cat)&&t.ro>0).forEach(t=>{
    if(up(t.sancion)==='CUMPLIDA') return;
    const p=S.partidos.find(x=>x.id===t.pid);
    out.push({tipo:'ROJA',categoria:t.categoria,equipo:t.equipo,jugador:t.jugador,pid:t.pid,
      detalle:p? ('J'+p.jornada+' vs '+corto(p.local===t.equipo?p.visita:p.local)) : 'sin partido asignado',
      fechas:num(S.cfg.FECHAS_SUSPENSION_ROJA)||1});
  });
  const N=amParaSusp();
  const ac={};
  S.tarjetas.filter(t=>(!cat||t.categoria===cat)&&t.am>0).forEach(t=>{
    const k=t.categoria+'|'+t.equipo+'|'+clave(t.jugador);
    if(!ac[k]) ac[k]={categoria:t.categoria,equipo:t.equipo,jugador:t.jugador,am:0};
    ac[k].am+=t.am;
  });
  Object.values(ac).forEach(x=>{
    if(x.am>=N) out.push({tipo:'AMARILLAS',categoria:x.categoria,equipo:x.equipo,jugador:x.jugador,pid:'',
      detalle:x.am+' amarillas acumuladas (tope '+N+')',fechas:Math.floor(x.am/N)});
  });
  return out.sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.equipo.localeCompare(b.equipo));
}

function tabTarjetas(){
  const cat=S.filtros.tcat||'', eqf=S.filtros.teq||'';

  const eqfCat=ixEqf<0?'':eqf.slice(0,ixEqf), eqfEq=ixEqf<0?eqf:eqf.slice(ixEqf+1);
  const mismoEq = x => !eqf||(x.categoria===eqfCat&&x.equipo===eqfEq);
  const eqs=[...new Set(S.equipos.filter(e=>!cat||e.categoria===cat).map(e=>e.categoria+'|'+e.equipo))]
    .map(k=>{ const i=k.indexOf('|'); return {categoria:k.slice(0,i),equipo:k.slice(i+1)}; })
    .sort((a,b)=>a.equipo.localeCompare(b.equipo));
  const L=fairplay(cat||null).filter(mismoEq);
  const porEq={};
  L.forEach(t=>{ const k=t.categoria+'|'+t.equipo;
    const e=porEq[k]||(porEq[k]={equipo:t.equipo,categoria:t.categoria,am:0,ro:0});
    e.am+=t.am; e.ro+=t.ro; });
  const eq=Object.values(porEq).sort((a,b)=>(b.ro*3+b.am)-(a.ro*3+a.am));
  const tam=L.reduce((s,t)=>s+t.am,0), tro=L.reduce((s,t)=>s+t.ro,0);

          (cat?'':' · '+e.categoria.replace('GRUPO ','').replace('FEMENINO','FEM'))+'</option>'; }).join('')+'</select></div>'+
    '<div style="flex:0 0 auto;align-self:center" class="muted">'+

function tabCalendario(){
  const cat=S.filtros.ccat||'', jor=S.filtros.cjor||'', eqf=S.filtros.ceq||'',
        est=S.filtros.cest||'', dia=S.filtros.cdia||'';
  let L=S.partidos.filter(p=>(!cat||p.categoria===cat)&&(!jor||String(p.jornada)===String(jor))&&
    (!eqf||p.local===eqf||p.visita===eqf)&&(!est|| (est==='JUGADO'?p.jugado:!p.jugado))&&
    (!dia|| (dia==='SIN FECHA'? !has(p.fecha) : p.fecha===dia)));
  const jornadas=[...new Set(S.partidos.map(p=>p.jornada).filter(has))].sort((a,b)=>a-b);
  const eqs=[...new Set(S.equipos.filter(e=>!cat||e.categoria===cat).map(e=>e.equipo))].sort();
  /* los días disponibles según los demás filtros, para poder bajar un solo día */
  const dias=[...new Set(S.partidos.filter(p=>(!cat||p.categoria===cat)&&
    (!jor||String(p.jornada)===String(jor))).map(p=>p.fecha).filter(has))].sort();

  /* Cada bloque es una jornada de UN día: si la jornada 6 va de viernes a
     domingo, salen tres bloques y la imagen se puede bajar por día.          */
  const grupos={}, meta={};
  L.forEach(p=>{
    const base=(p.fase==='GRUPOS'?'JORNADA '+p.jornada:p.fase)+' · '+p.categoria;
    const k=base+'‖'+(p.fecha||'');
    if(!grupos[k]){ grupos[k]=[]; meta[k]={titulo:base,fecha:p.fecha||'',jornada:num(p.jornada)||99}; }
    grupos[k].push(p);
  });
  Object.keys(grupos).forEach(k=>grupos[k].sort((a,b)=>
    (a.hora||'zz').localeCompare(b.hora||'zz')||a.id.localeCompare(b.id)));
  const keys=Object.keys(grupos).sort((a,b)=>{
    const A=meta[a],B=meta[b];
    return (A.fecha||'9999').localeCompare(B.fecha||'9999')||A.jornada-B.jornada||A.titulo.localeCompare(B.titulo);
  });
  S.calendario={keys,grupos,meta};   /* lo usa la descarga de imagen */

  return '<div class="card" style="margin-bottom:14px"><div class="pad row noprint">'+
    '<div><label>Categoría</label>'+selCat('fCcat',cat,true)+'</div>'+
    '<div><label>Jornada</label><select id="fCjor"><option value="">Todas</option>'+
      jornadas.map(j=>'<option'+(String(j)===String(jor)?' selected':'')+'>'+j+'</option>').join('')+'</select></div>'+
    '<div><label>Equipo</label><select id="fCeq"><option value="">Todos</option>'+
      eqs.map(e=>'<option'+(e===eqf?' selected':'')+' value="'+esc(e)+'">'+esc(corto(e))+'</option>').join('')+'</select></div>'+
    '<div><label>Día</label><select id="fCdia"><option value="">Todos los días</option>'+
      dias.map(d=>'<option value="'+esc(d)+'"'+(d===dia?' selected':'')+'>'+esc(fechaTxt(d))+'</option>').join('')+
      '<option value="SIN FECHA"'+(dia==='SIN FECHA'?' selected':'')+'>Sin fecha</option></select></div>'+
    '<div><label>Estado</label><select id="fCest"><option value="">Todos</option>'+
      ['JUGADO','PENDIENTE'].map(x=>'<option'+(x===est?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
    '<div style="flex:0 0 auto"><button class="btn amb" id="btnImg">🖼 Descargar imagen</button></div>'+
    '<div style="flex:0 0 auto"><button class="btn" onclick="window.print()">🖨 Imprimir</button></div>'+
    '</div>'+
    '<div class="pad muted noprint" style="padding-top:0;font-size:11.5px">La imagen sale con lo que estés '+
    'viendo ahora (según los filtros), lista para mandar por WhatsApp.</div></div>'+
    '<div class="card">'+
    (keys.length? keys.map(k=>{
      const g=grupos[k], jg=g.filter(p=>p.jugado).length, m=meta[k];
      return '<div class="jhead"><h4>'+esc(m.titulo)+
        (has(m.fecha)?' <span style="color:var(--txt);font-weight:600"> · '+esc(fechaTxt(m.fecha))+'</span>':
          ' <span style="color:var(--muted)"> · sin fecha</span>')+'</h4>'+
        '<span>'+jg+' de '+g.length+' jugados</span></div>'+
        g.map(p=>filaPartido(p)).join('');
    }).join('') : '<div class="pad muted">No hay partidos con esos filtros.</div>')+
    '</div>';
}

/* ---------- FASES FINALES ---------- */
function tabFases(){
  const n=clasN('GRUPO A');
  const A=tabla('GRUPO A'), B=tabla('GRUPO B');
  const reales=S.partidos.filter(p=>p.fase!=='GRUPOS');
  const cruces=[];
  for(let i=0;i<n;i++){
    const a=A[i], b=B[n-1-i];
    if(a&&b) cruces.push({lbl:'A'+(i+1)+' vs B'+(n-i),local:a.equipo,visita:b.equipo});
  }
  const tie = (lbl,l,v,gl,gv)=>'<div class="tie"><div class="lbl">'+esc(lbl)+'</div>'+
    '<div class="s'+(gl!=null&&gl>gv?' w':'')+'"><b>'+esc(corto(l))+'</b><span class="g">'+(gl==null?'-':gl)+'</span></div>'+
    '<div class="s'+(gl!=null&&gv>gl?' w':'')+'"><b>'+esc(corto(v))+'</b><span class="g">'+(gv==null?'-':gv)+'</span></div></div>';

  let h='';

  if(reales.length){
    const porFase={};
    reales.forEach(p=>(porFase[p.fase]=porFase[p.fase]||[]).push(p));
    h+='<div class="card" style="margin-bottom:14px"><h2>Fases finales en juego</h2>'+
      FASES.filter(f=>porFase[f]).map(f=>'<div class="jhead"><h4>'+f+'</h4><span>'+porFase[f].length+' partidos</span></div>'+
        porFase[f].map(p=>filaPartido(p,p.categoria)).join('')).join('')+'</div>';
  }

  h+='<div class="card" style="margin-bottom:14px"><h2>Cruces propuestos '+
    '<span class="sub">top '+n+' de cada grupo</span></h2><div class="pad">'+
    '<div class="brk"><div class="col"><h4>Llave</h4>'+
      (cruces.length? cruces.map(c=>tie(c.lbl,c.local,c.visita,null,null)).join('') : '<div class="muted">Faltan datos</div>')+
    '</div></div>'+
    '<button class="btn amb noprint" id="btnCruces" data-tipo="H">+ Mandar al borrador como '+faseDe(n*2)+'</button>'+
    '</div></div>';

  h+='<div class="grid g2">'+[['GRUPO A',A,n],['GRUPO B',B,n]].map(([c,t,k])=>
    '<div class="card"><h3>Clasificados · '+c+'</h3><div class="tw"><table><tbody>'+
    t.slice(0,k).map((r,i)=>'<tr class="clasif"><td class="pos">'+(i+1)+'</td><td class="b">'+esc(corto(r.equipo))+'</td>'+
    '<td class="n"><span class="pts">'+r.pts+'</span></td></tr>').join('')+'</tbody></table></div></div>').join('')+'</div>';
  return h;
}

/* ---------- detalle de un equipo, con foto para mandarle ---------- */
function cardDetallePago(claveEq){
  if(!claveEq) return '';
  const ix0=claveEq.indexOf('|');
  const categoria=ix0<0?'':claveEq.slice(0,ix0), equipo=ix0<0?claveEq:claveEq.slice(ix0+1);
  const e=S.equipos.find(x=>x.categoria===categoria&&x.equipo===equipo);
  if(!e) return '';
  const pagos=S.pagos.filter(p=>p.equipo===equipo&&p.categoria===categoria)
    .sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||num(a.cuota)-num(b.cuota));
  const abonado=pagos.filter(p=>p.concepto.indexOf('INSCRIP')===0).reduce((s,p)=>s+p.valor,0);
  const deuda=pagos.filter(p=>p.concepto.indexOf('ARBITRAJE ADEU')===0).reduce((s,p)=>s+p.valor,0);
  const val=valorInscripcion(e.categoria);
  const saldo=Math.max(0,val-abonado+deuda);
  return '<div class="card" style="margin-bottom:14px;border-color:var(--verde)"><h2>'+esc(corto(equipo))+
    ' <span class="sub">'+e.categoria+'</span>'+
    '<button class="btn sm amb noprint" id="btnImgPago" style="margin-left:auto">🖼 Imagen</button>'+
    '<button class="btn sm noprint" id="btnCerrarPago">✕</button></h2>'+
    '<div class="grid g4 pad">'+
      '<div class="stat"><div class="n">$'+val.toFixed(2)+'</div><div class="l">Inscripción</div></div>'+
      '<div class="stat"><div class="n">$'+abonado.toFixed(2)+'</div><div class="l">Abonado</div></div>'+
      '<div class="stat'+(saldo>0?' r2':'')+'"><div class="n">$'+saldo.toFixed(2)+'</div><div class="l">'+
        (saldo>0?'Saldo pendiente':'Al día ✔')+'</div></div>'+
      '<div class="stat a"><div class="n">$'+deuda.toFixed(2)+'</div><div class="l">Arbitraje adeudado</div></div>'+
    '</div>'+
    (pagos.length? '<div class="tw"><table><thead><tr><th class="n">Jornada</th><th>Fecha</th><th>Concepto</th>'+
      '<th class="n">Valor</th>'+(hayAPI()?'<th class="noprint"></th>':'')+'</tr></thead><tbody>'+
      pagos.map(p=>{
        const clave=[p.categoria,p.equipo,p.concepto,p.cuota,p.fecha,p.valor].join('||');
        const c=S.editPagos[clave]||{};
        const cuota=c.cuota!==undefined?c.cuota:p.cuota;
        const fecha=c.fecha!==undefined?c.fecha:p.fecha;
        const valor=c.valor!==undefined?c.valor:p.valor;
        return '<tr'+(S.editPagos[clave]?' style="box-shadow:inset 3px 0 0 var(--ambar)"':'')+'>'+
          '<td class="n"><input type="number" min="1" data-editpago="cuota" data-clave="'+esc(clave)+
            '" value="'+esc(cuota)+'" placeholder="—" style="width:56px;text-align:center"></td>'+
          '<td><input type="date" data-editpago="fecha" data-clave="'+esc(clave)+'" value="'+esc(fecha)+
            '" style="min-width:130px"></td>'+
          '<td>'+esc(p.concepto)+'</td>'+
          '<td class="n"><input type="number" min="0" step="0.5" data-editpago="valor" data-clave="'+esc(clave)+
            '" value="'+esc(valor)+'" style="width:90px;text-align:right"></td>'+
          (hayAPI()?'<td class="n noprint"><button class="btn sm" data-borrarpago="'+esc(clave)+
            '" title="Borrar este pago">✕</button></td>':'')+
          '</tr>';
      }).join('')+'</tbody></table></div>'+
      (hayAPI()
        ? (Object.keys(S.editPagos).length
          ? '<div class="pad row noprint">'+
            '<div style="flex:0 0 auto"><button class="btn pri" id="btnSavePagos">💾 Guardar '+
            Object.keys(S.editPagos).length+' cambio'+(Object.keys(S.editPagos).length>1?'s':'')+' en el Sheet</button></div>'+
            '<div style="flex:0 0 auto"><button class="btn" id="btnUndoPagos">Descartar</button></div></div>'
          : '<div class="pad muted noprint" style="font-size:11.5px">Todo guardado ✔ Cambiá la jornada, la fecha '+
            'o el valor de un pago y aparece el botón para subirlo al Sheet.</div>')
        : '<div class="pad muted" style="font-size:11.5px">Para editar un pago necesitás el puente de escritura conectado.</div>')
      : '<div class="pad muted">Este equipo todavía no tiene ningún pago registrado.</div>')+
    '</div>';
}

function tabPagos(){
  const cat=S.filtros.qcat||'';
  const M={};
  /* arranco con todos los equipos, aunque no hayan pagado nada */
  S.equipos.filter(e=>!cat||e.categoria===cat).forEach(e=>{
    M[e.categoria+'|'+e.equipo]={categoria:e.categoria,equipo:e.equipo,ins:0,arb:0,deuda:0,otro:0};
  });
  S.pagos.filter(p=>!cat||p.categoria===cat).forEach(p=>{
    const k=p.categoria+'|'+p.equipo;
    if(!M[k]) M[k]={categoria:p.categoria,equipo:p.equipo,ins:0,arb:0,deuda:0,otro:0};
    if(p.concepto.indexOf('INSCRIP')===0) M[k].ins+=p.valor;
    else if(p.concepto.indexOf('ARBITRAJE ADEU')===0) M[k].deuda+=p.valor;
    else if(p.concepto.indexOf('ARBITR')===0) M[k].arb+=p.valor;
    else M[k].otro+=p.valor;
  });
  const L=Object.values(M).map(r=>{
    const val=valorInscripcion(r.categoria);
    return {...r, valor:val, saldo:Math.max(0,val-r.ins), pagadoTodo:val>0&&r.ins>=val};
  }).sort((a,b)=>a.categoria.localeCompare(b.categoria)||b.saldo-a.saldo||a.equipo.localeCompare(b.equipo));
  const T=L.reduce((a,x)=>({ins:a.ins+x.ins,arb:a.arb+x.arb,deuda:a.deuda+x.deuda,otro:a.otro+x.otro,
    valor:a.valor+x.valor,saldo:a.saldo+x.saldo}),{ins:0,arb:0,deuda:0,otro:0,valor:0,saldo:0});
  const $$=v=>'$'+v.toFixed(2);
  const alDia=L.filter(r=>r.pagadoTodo).length;

  return cardRegistroPago()+cardDetallePago(S.filtros.qEquipo)+
    '<div class="card" style="margin-bottom:14px"><div class="pad row noprint">'+
    '<div><label>Categoría</label>'+selCat('fQcat',cat,true)+'</div>'+
    '<div style="flex:0 0 auto"><button class="btn" onclick="window.print()">🖨 Imprimir</button></div></div></div>'+
    '<div class="grid g4" style="margin-bottom:14px">'+
      '<div class="stat"><div class="n">'+$$(T.ins)+'</div><div class="l">Cobrado de inscripción</div></div>'+
      '<div class="stat a"><div class="n">'+$$(T.saldo)+'</div><div class="l">Falta cobrar · '+(L.length-alDia)+' equipos</div></div>'+
      '<div class="stat"><div class="n">'+$$(T.valor)+'</div><div class="l">Total esperado</div></div>'+
      '<div class="stat a"><div class="n">'+$$(T.deuda)+'</div><div class="l">Arbitraje adeudado</div></div>'+
    '</div>'+
    '<div class="card"><h2>Detalle por equipo <span class="sub">'+alDia+' de '+L.length+' con la inscripción al día</span></h2>'+
    '<div class="tw"><table><thead><tr>'+
    '<th>Cat.</th><th>Equipo</th><th class="n">Inscripción</th><th class="n">Pagado</th><th class="n">Falta</th>'+
    '<th class="n mh">Arbitraje adeudado</th><th class="n mh">Otros</th><th class="n">Estado</th>'+
    '</tr></thead><tbody>'+
    L.map(r=>'<tr style="cursor:pointer" data-verpago="'+esc(r.categoria+'|'+r.equipo)+'" title="Ver el detalle de este equipo">'+
      '<td><span class="tag">'+r.categoria.replace('GRUPO ','').replace('FEMENINO','FEM')+'</span></td>'+
      '<td class="b">'+esc(corto(r.equipo))+'</td>'+
      '<td class="n muted">'+$$(r.valor)+'</td>'+
      '<td class="n">'+$$(r.ins)+'</td>'+
      '<td class="n '+(r.saldo>0?'dg-n':'')+'">'+(r.saldo>0?$$(r.saldo):'—')+'</td>'+
      '<td class="n mh">'+(r.deuda>0?$$(r.deuda):'—')+'</td>'+
      '<td class="n mh">'+(r.otro>0?$$(r.otro):'—')+'</td>'+

/* Busca dos nombres distintos, del mismo equipo, que parecen la misma persona */
function nombresParecidos(fuente){
  const out=[], vistos={};
  S.equipos.forEach(e=>{
    const nombres=jugadoresDe(e.equipo,fuente);
    for(let i=0;i<nombres.length;i++) for(let j=i+1;j<nombres.length;j++){
      const a=nombres[i], b=nombres[j];
      const igualOrden = claveOrden(a)===claveOrden(b);
      const cerca = distancia(clave(a),clave(b))<=2;
      if(igualOrden||cerca){
        const k=e.equipo+'|'+[clave(a),clave(b)].sort().join('|');
        if(vistos[k]) continue;
        vistos[k]=1;
        out.push({equipo:e.equipo,a,b});
      }
    }
  });
  return out;
}

function agregarPartido(){
  const p={ id:'', categoria:$('#nCat').value, fase:$('#nFase').value, jornada:$('#nJor').value||'',
    fecha:$('#nFecha').value, hora:$('#nHora').value, cancha:'',

  if(p.local===p.visita){ toast('Local y visita no pueden ser el mismo'); return; }
  const yaJugado = S.partidos.some(x=>x.categoria===p.categoria&&x.fase===p.fase&&
    ((x.local===p.local&&x.visita===p.visita)||(x.local===p.visita&&x.visita===p.local)));
  if(yaJugado && !confirm('Ese cruce ya existe en PARTIDOS. ¿Agregarlo igual (revancha)?')) return;
  const nid=nextId(); p.id=nid(1);
  S.borrador.push(p); guardarBorrador(); render(); toast('Agregado '+p.id);

function generarJornada(){
  const cat=S.filtros.pcat||'GRUPO A';
  const pend=pares(cat).filter(x=>!x.partidos.length);
  const usados=new Set(), nuevos=[];
  pend.forEach(x=>{ if(!usados.has(x.a)&&!usados.has(x.b)){ usados.add(x.a);usados.add(x.b);nuevos.push(x); } });
  if(!nuevos.length){ toast('No quedan cruces libres en '+cat); return; }
  const jornadas=[...new Set(partidosDe(cat).map(p=>p.jornada).filter(has))];
  const j=(jornadas.length?Math.max(...jornadas):0)+1;
  const nid=nextId();
  nuevos.forEach((x,i)=>S.borrador.push({ id:nid(i+1), categoria:cat, fase:'GRUPOS', jornada:j,
    fecha:'', hora:'', cancha:'', local:x.a, visita:x.b }));
  guardarBorrador(); render();
  toast(nuevos.length+' partidos armados para la jornada '+j);
}
function mandarCruces(tipo){
  const A=tabla('GRUPO A'), B=tabla('GRUPO B');
  const nid=nextId(); let k=0;
  {
    const n=clasN('GRUPO A'), fase=faseDe(n*2);
    for(let i=0;i<n;i++){ const a=A[i],b=B[n-1-i]; if(!a||!b) continue;
      S.borrador.push({id:nid(++k),categoria:'GRUPO A',fase,jornada:'',fecha:'',hora:'',cancha:'',local:a.equipo,visita:b.equipo}); }

/* Evita que el mismo jugador quede cargado dos veces con distinta escritura.
   Si ya existe, usa el nombre oficial. Si se parece a uno, pregunta.         */
function nombreConfirmado(equipo,escrito,fuente){
  const r=resolverJugador(equipo,escrito,fuente);
  if(r.exacto) return r.nombre;
  if(r.parecido){
    if(confirm('¿Es "'+r.parecido+'"?\n\nEscribiste "'+up(escrito)+'".\n\n'+
       'OK = usar "'+r.parecido+'" (recomendado)\nCancelar = guardarlo como jugador nuevo'))
      return r.parecido;
  }
  return r.nombre;
}

async function marcarCumplida(pid,jugador){

  S.guardando=true;
  bloqAbrir('Actualizando el Sheet…','Marcando la sanción de '+jugador+' como cumplida.');

    await apiPost({action:'setSancion',pid,jugador,valor:'CUMPLIDA'});
    bloqTexto('Verificando…','Confirmando el cambio en el Sheet.');
    let listo=false;
    for(let intento=1;intento<=3&&!listo;intento++){
      await esperar(2400);
      await cargar();
      listo=!suspendidos(null).some(s=>s.tipo==='ROJA'&&clave(s.jugador)===clave(jugador));
    }
    render();
    if(listo) bloqFin(true,'Guardado con éxito',jugador+' ya cumplió la sanción y deja de aparecer como suspendido.');

/* Corrige jornada, fecha o valor de un pago ya cargado. No hay una columna
   ID en PAGOS, así que se borra la fila original (por sus valores exactos)
   y se agrega una nueva con los datos corregidos.                          */
async function guardarEdicionPagos(){
  const claves=Object.keys(S.editPagos);
  if(!claves.length) return;
  if(S.guardando) return;
  S.guardando=true;
  bloqAbrir('Guardando '+claves.length+' pago'+(claves.length>1?'s':'')+'…',
    'Corrigiendo cada pago en el Sheet. No toques nada hasta que termine.');
  try{
    const pedido=claves.map(clave=>{
      const [categoria,equipo,concepto,cuotaOrig,fechaOrig,valorOrig]=clave.split('||');
      const orig=S.pagos.find(p=>p.categoria===categoria&&p.equipo===equipo&&p.concepto===concepto&&
        String(p.cuota)===cuotaOrig&&p.fecha===fechaOrig&&String(p.valor)===valorOrig);
      const c=S.editPagos[clave];
      return {
        equipo, concepto, cuotaOrig, fechaOrig, valorOrig,
        categoria: categoria||(orig?orig.categoria:''),
        obs: orig?orig.obs:'',
        cuotaNueva: c.cuota!==undefined?c.cuota:cuotaOrig,
        fechaNueva: c.fecha!==undefined?c.fecha:fechaOrig,
        valorNueva: c.valor!==undefined?num(c.valor):num(valorOrig)
      };
    });
    for(const p of pedido){
      await apiPost({action:'borrarFilas',hoja:'PAGOS',filtros:{
        CATEGORIA:p.categoria, EQUIPO:p.equipo, CONCEPTO:p.concepto, CUOTA:p.cuotaOrig, FECHA:p.fechaOrig, VALOR:p.valorOrig }});
      await esperar(900);
      await apiPost({action:'append',hoja:'PAGOS',
        rows:[[p.categoria,p.equipo,p.concepto,p.cuotaNueva,p.fechaNueva,p.valorNueva,p.obs]]});
      await esperar(900);
    }
    bloqTexto('Verificando…','Confirmando los cambios en el Sheet.');
    let faltan=pedido;
    for(let intento=1;intento<=4&&faltan.length;intento++){
      await esperar(intento===1?2200:2500);
      await cargar();
      faltan=pedido.filter(p=>!S.pagos.some(x=>x.categoria===p.categoria&&x.equipo===p.equipo&&x.concepto===p.concepto&&
        String(x.cuota)===String(p.cuotaNueva)&&x.fecha===p.fechaNueva&&Math.abs(x.valor-p.valorNueva)<0.01));
      if(faltan.length&&intento<4) bloqTexto('Verificando…','Faltan '+faltan.length+' por confirmar. Reintento '+intento+' de 3.');
    }
    S.editPagos={};
    render();
    if(faltan.length) bloqFin(false,'No se guardó todo',
      'Quedaron sin confirmar '+faltan.length+' pago'+(faltan.length>1?'s':'')+'. Revisá la hoja PAGOS.');
    else bloqFin(true,'Guardado con éxito',
      pedido.length+' pago'+(pedido.length>1?'s':'')+' actualizado'+(pedido.length>1?'s':'')+' en el Sheet.');
  }catch(e){ bloqFin(false,'No se pudo guardar',e.message); }
  finally{ S.guardando=false; }
}

/* Imagen del estado de cuenta de un equipo, para mandarle por WhatsApp */
function imagenPago(claveEq){
  const ix0=claveEq.indexOf('|');
  const categoria=ix0<0?'':claveEq.slice(0,ix0), equipo=ix0<0?claveEq:claveEq.slice(ix0+1);
  const e=S.equipos.find(x=>x.categoria===categoria&&x.equipo===equipo);

  const pagos=S.pagos.filter(p=>p.equipo===equipo&&p.categoria===categoria&&p.valor>0)
    .sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||num(a.cuota)-num(b.cuota));
  const abonado=pagos.filter(p=>p.concepto.indexOf('INSCRIP')===0).reduce((s,p)=>s+p.valor,0);
  const deuda=pagos.filter(p=>p.concepto.indexOf('ARBITRAJE ADEU')===0).reduce((s,p)=>s+p.valor,0);
  const val=valorInscripcion(e.categoria);
  const saldo=Math.max(0,val-abonado+deuda);
  const P=40, HF=56;
  const alto=478+Math.max(pagos.length,1)*HF+(deuda>0?52:0);

  exportarPNG({
    alto, nombre:'estado-'+corto(equipo).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png', sinPie:true,
    sub:'Estado de cuenta · '+corto(equipo),

      const ancho=W-P*2;

      x.fillStyle='#8ea0ba'; x.font=FC(20,600); x.textBaseline='middle';
      x.textAlign='center'; x.fillText('JORNADA',P+80,y+24);
      x.textAlign='left';   x.fillText('FECHA',P+170,y+24);
      x.fillText('CONCEPTO',P+330,y+24);
      x.textAlign='right';  x.fillStyle='#f2c230'; x.fillText('VALOR',W-P-24,y+24);
      y+=56;
      if(!pagos.length){
        x.fillStyle='#121b2b'; rr(x,P,y,ancho,48,10);
        x.fillStyle='#8ea0ba'; x.font=FSS(20,500); x.textAlign='center';
        x.fillText('Sin pagos registrados',W/2,y+24);
        y+=HF;
      }
      pagos.forEach(p=>{
        x.fillStyle='#121b2b'; rr(x,P,y,ancho,48,10);
        const cy=y+24;
        x.font=FSS(19,600); x.fillStyle='#c9d6e8'; x.textAlign='center';
        x.fillText(p.cuota||'—',P+80,cy);
        x.textAlign='left'; x.fillStyle='#8ea0ba'; x.font=FSS(17,500);
        x.fillText(has(p.fecha)?fechaTxt(p.fecha):'—',P+170,cy);
        x.fillStyle='#e9f0fa'; x.font=FSS(18,600);
        x.fillText(p.concepto,P+330,cy);
        x.textAlign='right'; x.fillStyle='#fff'; x.font=FC(24,700);
        x.fillText('$'+p.valor.toFixed(2),W-P-24,cy+1);
        y+=HF;
      });
      /* resumen */
      y+=10;
      const fila=(t,v,color,alto2)=>{

      fila(saldo>0?'SALDO PENDIENTE':'AL DÍA ✔', saldo>0?'$'+saldo.toFixed(2):'$0.00',
        saldo>0?'#ff8b83':'#2fbdf0', 56);

    }
  });

/* Manda al Sheet los cambios de fecha/hora de los partidos ya programados */
async function guardarReprogramacion(){
  const ids=Object.keys(S.editPartidos);
  if(!ids.length) return;
  if(S.guardando) return;
  S.guardando=true;
  try{
    bloqAbrir('Guardando '+ids.length+' partido'+(ids.length>1?'s':'')+'…',
      'Estoy escribiendo en el Sheet. No toques nada hasta que termine.');
    const pedido={};
    let jugados=0;
    ids.forEach(id=>{
      const c=S.editPartidos[id], p=S.partidos.find(x=>x.id===id);
      const gl=c.gl!==undefined?c.gl:(p.gl==null?'':p.gl);
      const gv=c.gv!==undefined?c.gv:(p.gv==null?'':p.gv);
      const pasaAJugado=has(gl)&&has(gv);
      if(pasaAJugado&&!p.jugado) jugados++;
      pedido[id]={ fecha:c.fecha!==undefined?c.fecha:p.fecha,
                   hora:c.hora!==undefined?c.hora:p.hora,
                   gl, gv, estado: pasaAJugado?'JUGADO':'' };
    });
    /* Se mandan todos juntos, no de uno en uno: el Sheet los procesa en fila
       pero acá no esperamos entre cada uno.                                  */
    await Promise.all(ids.map(id=>apiPost(Object.assign({action:'setPartido',id},pedido[id]))));

    /* Verifico releyendo, con reintentos: si el Sheet todavía no reflejó los
       cambios, vuelvo a mirar en vez de dar un falso error.                   */
    const noAplicado=id=>{
      const q=pedido[id], p=S.partidos.find(x=>x.id===id);
      if(!p) return true;
      return (has(q.fecha)&&p.fecha!==q.fecha)
          || (has(q.hora)&&p.hora!==q.hora)
          || (has(q.gl)&&String(p.gl)!==String(q.gl))
          || (has(q.gv)&&String(p.gv)!==String(q.gv));
    };
    bloqTexto('Verificando…','Estoy releyendo el Sheet para confirmar que quedó todo.');
    let faltan=ids;
    for(let intento=1;intento<=4&&faltan.length;intento++){
      await esperar(intento===1?2000:2500);
      await cargar();
      faltan=ids.filter(noAplicado);
      if(faltan.length&&intento<4)
        bloqTexto('Verificando…','Faltan '+faltan.length+' por confirmar. Reintento '+intento+' de 3.');
    }
    S.editPartidos={};
    render();
    if(faltan.length) bloqFin(false,'No se guardó todo','Quedaron sin guardar: '+faltan.join(', ')+
      '. Volvé a intentar con esos.');
    else bloqFin(true,'Guardado con éxito',
      jugados? (jugados===ids.length?'Marcador'+(jugados>1?'es':'')+' cargado'+(jugados>1?'s':'')+
        '. Ahora cargá los goleadores en la pestaña Goleadores.'
        : ids.length+' partidos actualizados, '+jugados+' con marcador. Cargá los goleadores en su pestaña.')
      : ids.length+' partido'+(ids.length>1?'s':'')+' actualizado'+(ids.length>1?'s':'')+' en el Sheet.');
  }catch(e){ bloqFin(false,'No se pudo guardar',e.message); }
  finally{ S.guardando=false; }
}
function aplicarBloque(){
  const f=$('#blkFecha').value, h=$('#blkHora').value, cada=num($('#blkCada').value);

/* ---------- exportar a imagen (calendario, posiciones, goleadores) ---------- */
const FC  = (s,w) => (w||600)+' '+s+'px "Barlow Condensed",Arial,sans-serif';
const FSS = (s,w) => (w||500)+' '+s+'px Inter,Arial,sans-serif';

/* Dibuja el lienzo, el encabezado con el logo y descarga el PNG.
   dibujar(x, W, y0) pinta el contenido y devuelve nada.                      */
function exportarPNG(opt){
  const W=1080, R=2, H=opt.alto;
  const cv=document.createElement('canvas');
  cv.width=W*R; cv.height=H*R;
  const x=cv.getContext('2d');
  x.scale(R,R);

  const fondo = () => {
    x.fillStyle='#070b12'; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(47,189,240,.06)';
    for(let i=0;i<W;i+=68) x.fillRect(i,0,34,H);
    x.fillStyle='#111'; x.fillRect(0,0,W,186);
    x.strokeStyle='#2fbdf0'; x.lineWidth=4;
    x.beginPath(); x.moveTo(0,186); x.lineTo(W,186); x.stroke();
  };
  const cabecera = conLogo => {
    const X = conLogo?170:44;
    x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillStyle='#fff'; x.font=FC(58,700);
    x.fillText('COPA ',X,82);
    x.fillStyle='#f2c230';
    x.fillText('PALERMO',X+x.measureText('COPA ').width,82);
    x.fillStyle='#8ea0ba'; x.font=FSS(21,500);
    x.fillText(S.cfg.SEDE||'COMPLEJO DEPORTIVO VELEZ AUTO',X,118);
    x.fillStyle='#2fbdf0'; x.font=FC(30,700);
    x.fillText(String(opt.sub||'').toUpperCase(),X,160);
  };
  const pie = txt => {
    x.fillStyle='#8ea0ba'; x.font=FSS(16,500); x.textAlign='center';
    x.fillText(txt,W/2,H-24);
  };
  const bajar = () => {
    try{
      const a=document.createElement('a');
      a.href=cv.toDataURL('image/png');
      a.download=opt.nombre||'copa-palermo.png';
      a.click();
      toast('Imagen descargada ✔');
    }catch(e){ toast('No pude generar la imagen'); }
  };
  const contenido = conLogo => {
    cabecera(conLogo);
    opt.dibujar(x,W,232);
    if(!opt.sinPie)
      pie('Generado el '+new Date().toLocaleDateString('es-EC',{day:'2-digit',month:'long',year:'numeric'})+
          (opt.pie? '  ·  '+opt.pie : ''));
  };

  const img=new Image();
  img.onload=()=>{
    fondo();
    x.save();
    x.beginPath(); x.arc(96,93,54,0,Math.PI*2); x.closePath(); x.clip();
    x.drawImage(img,42,39,108,108);
    x.restore();
    x.strokeStyle='#2fbdf0'; x.lineWidth=3;
    x.beginPath(); x.arc(96,93,54,0,Math.PI*2); x.stroke();
    contenido(true);
    try{ cv.toDataURL('image/png'); bajar(); }
    catch(e){                       /* abierto con doble clic: el logo ensucia el canvas */
      x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,cv.width,cv.height); x.scale(R,R);
      fondo(); contenido(false); bajar();
    }
  };
  img.onerror=()=>{ fondo(); contenido(false); bajar(); };
  img.src='assets/logo.jpg';
}

/* rectángulo con esquinas redondeadas (con respaldo si el navegador es viejo) */
function rr(x,px,py,w,h,r){
  if(x.roundRect){ x.beginPath(); x.roundRect(px,py,w,h,r); x.fill(); return; }
  x.beginPath();
  x.moveTo(px+r,py); x.lineTo(px+w-r,py); x.quadraticCurveTo(px+w,py,px+w,py+r);
  x.lineTo(px+w,py+h-r); x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
  x.lineTo(px+r,py+h); x.quadraticCurveTo(px,py+h,px,py+h-r);
  x.lineTo(px,py+r); x.quadraticCurveTo(px,py,px+r,py); x.closePath(); x.fill();
}

/* ---------- imagen del calendario ---------- */
function descargarImagen(){
  const cal=S.calendario;
  if(!cal||!cal.keys.length){ toast('No hay partidos para exportar'); return; }
  const P=40, HJ=82, HP=92;                 /* alto del título de jornada y de cada partido */
  /* el contenido arranca en 208; cada bloque = título + partidos, y 8px entre bloques */
  const alto = 208 + cal.keys.reduce((s,k)=>s+HJ+cal.grupos[k].length*HP, 0)
    + 8*(cal.keys.length-1) + 12;
  const sub=[];
  if(S.filtros.cjor) sub.push('Jornada '+S.filtros.cjor);
  if(S.filtros.ccat) sub.push(S.filtros.ccat);
  if(S.filtros.cdia&&S.filtros.cdia!=='SIN FECHA') sub.push(fechaTxt(S.filtros.cdia));
  if(S.filtros.ceq) sub.push(corto(S.filtros.ceq));

  exportarPNG({
    alto, nombre:'calendario-copa-mama-julia.png', sinPie:true,
    sub: sub.join('  ·  ')||'Calendario completo',
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      let y=y0-12;
      cal.keys.forEach(k=>{
        /* ---- título de la jornada (un bloque por día) ---- */
        const m=(cal.meta&&cal.meta[k])||{titulo:k,fecha:''};
        x.fillStyle='#162133'; rr(x,P,y,ancho,58,12);
        x.fillStyle='#f2c230'; rr(x,P,y+12,5,34,3);
        x.fillStyle='#f2c230'; x.font=FC(32,700); x.textAlign='left'; x.textBaseline='middle';
        x.fillText(m.titulo,P+22,y+30);
        const g=cal.grupos[k];
        if(has(m.fecha)){
          x.font=FSS(20,700); x.textAlign='right';
          x.fillStyle='#e9f0fa'; x.fillText(fechaTxt(m.fecha).toUpperCase(),W-P-22,y+30);
        }
        y+=HJ;

        /* ---- partidos ---- */
        g.forEach(p=>{
          x.fillStyle='#121b2b'; rr(x,P,y,ancho,80,12);
          const cy=y+40;
          x.textBaseline='middle';

          if(p.jugado){
            /* marcador */
            x.fillStyle='#060a11'; rr(x,W/2-70,cy-27,140,54,10);
            x.fillStyle='#fff'; x.font=FC(40,700); x.textAlign='center';
            x.fillText(p.gl+' - '+p.gv,W/2,cy+2);
          } else if(has(p.hora)){
            /* hora en pastilla verde, con AM/PM */
            const t=hora12(p.hora), part=t.split(' ');
            x.font=FC(34,700);
            const wNum=x.measureText(part[0]).width;
            x.font=FC(20,700);
            const wAp=x.measureText(part[1]||'').width;
            const wTot=wNum+wAp+14, px=W/2-(wTot+40)/2;
            x.fillStyle='#2fbdf0'; rr(x,px,cy-25,wTot+40,50,25);
            x.fillStyle='#031622'; x.textAlign='left';
            x.font=FC(34,700); x.fillText(part[0],px+20,cy+2);
            x.font=FC(20,700); x.fillText(part[1]||'',px+20+wNum+8,cy+3);
          } else {
            x.fillStyle='#243049'; rr(x,W/2-32,cy-22,64,44,22);
            x.fillStyle='#8ea0ba'; x.font=FC(24,700); x.textAlign='center';
            x.fillText('VS',W/2,cy+1);
          }

          /* equipos */
          x.font=FSS(25,700);
          x.fillStyle=p.jugado&&p.gl>p.gv?'#2fbdf0':'#e9f0fa';
          x.textAlign='right'; x.fillText(corto(p.local),W/2-108,cy);
          x.fillStyle=p.jugado&&p.gv>p.gl?'#2fbdf0':'#e9f0fa';
          x.textAlign='left'; x.fillText(corto(p.visita),W/2+108,cy);
          y+=HP;
        });
        y+=8;
      });
      x.textBaseline='alphabetic';
    }
  });
}

/* ---------- imagen de la tabla de goleadores ---------- */
function imagenGoleadores(clave){
  const L = clave==='HOMBRES' ? goleadores(null).filter(g=>g.categoria!=='FEMENINO')
          : clave==='FEMENINO' ? goleadores('FEMENINO')
          : goleadores(clave);
  if(!L.length){ toast('No hay goleadores para exportar'); return; }
  const top=L.slice(0,8), P=40, HF=62;
  const titulo = clave==='HOMBRES'?'Copa Palermo' : clave;
  const alto = 208 + 54 + top.length*HF + 20;

  exportarPNG({
    alto, nombre:'goleadores-'+titulo.toLowerCase().replace(/ /g,'-')+'.png', sinPie:true,
    sub:'Goleadores · '+titulo+(L.length>top.length?'  ·  top 8':''),
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      let y=y0-12;
      /* encabezado */
      x.fillStyle='#162133'; rr(x,P,y,ancho,50,12);
      x.fillStyle='#8ea0ba'; x.font=FC(22,600); x.textBaseline='middle';
      x.textAlign='left'; x.fillText('JUGADOR',P+70,y+25);
      x.textAlign='right'; x.fillText('EQUIPO',ancho-110,y+25);
      x.fillStyle='#f2c230'; x.textAlign='center'; x.fillText('GOLES',W-P-52,y+25);
      y+=54;

      top.forEach((g,i)=>{
        const podio=i<3;
        x.fillStyle=podio?'#122035':'#121b2b'; rr(x,P,y,ancho,54,10);
        if(podio){ x.fillStyle='#2fbdf0'; rr(x,P,y+10,5,34,3); }
        const cy=y+27;
        /* puesto */
        x.textAlign='center'; x.font=FC(28,700);
        x.fillStyle=podio?'#2fbdf0':'#6a7a93';
        x.fillText(String(i+1),P+36,cy+1);
        /* jugador */
        x.textAlign='left'; x.font=FSS(24,700); x.fillStyle='#fff';
        x.fillText(g.jugador,P+70,cy);
        /* equipo */
        x.textAlign='right'; x.font=FSS(19,500); x.fillStyle='#8ea0ba';
        x.fillText(corto(g.equipo),ancho-110,cy);
        /* goles en pastilla */
        x.fillStyle='#f2c230'; rr(x,W-P-84,cy-20,64,40,20);
        x.fillStyle='#2a2000'; x.font=FC(28,700); x.textAlign='center';
        x.fillText(String(g.goles),W-P-52,cy+1);
        y+=HF;
      });
      x.textBaseline='alphabetic';
    }
  });
}

/* ---------- imagen de la tabla de posiciones ---------- */
function imagenPosiciones(cat){
  const t=tabla(cat), n=clasN(cat), P=44;
  if(!t.length){ toast('No hay equipos'); return; }
  const alto = 232 + 54 + t.length*62 + 46;
  /* columnas: PJ PG PE PP GF GC DG PTS */
  const cols=[['PJ','pj'],['PG','pg'],['PE','pe'],['PP','pp'],['GF','gf'],['GC','gc'],['DG','dg'],['PTS','pts']];
  exportarPNG({
    alto, nombre:'posiciones-'+cat.toLowerCase().replace(/ /g,'-')+'.png',
    sub:'Tabla de posiciones  ·  '+cat,
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      const xNum=[];                         /* centro de cada columna numerica */
      const wNum=64, wPts=84;
      let der=P+ancho-18;
      /* de derecha a izquierda: PTS mas ancho */
      for(let i=cols.length-1;i>=0;i--){
        const w=(i===cols.length-1)?wPts:wNum;
        der-=w; xNum[i]=der+w/2;
      }
      /* encabezado */
      x.fillStyle='#162133'; x.fillRect(P,y0-30,ancho,52);
      x.fillStyle='#8ea0ba'; x.font=FC(22,600);
      x.textAlign='left'; x.fillText('EQUIPO',P+64,y0+4);
      x.textAlign='center';
      cols.forEach((c,i)=>{
        x.fillStyle=i===cols.length-1?'#f2c230':'#8ea0ba';
        x.fillText(c[0],xNum[i],y0+4);
      });
      let y=y0+54;
      t.forEach((r,i)=>{
        const clas=i<n;
        x.fillStyle=clas?'#122035':'#0f1724'; x.fillRect(P,y-24,ancho,58);
        if(clas){ x.fillStyle='#2fbdf0'; x.fillRect(P,y-24,5,58); }
        /* puesto */
        x.textAlign='center'; x.font=FC(28,700);
        x.fillStyle=clas?'#2fbdf0':'#6a7a93';
        x.fillText(String(i+1),P+34,y+12);
        /* equipo */
        x.textAlign='left'; x.font=FSS(24,600); x.fillStyle='#fff';
        x.fillText(corto(r.equipo),P+64,y+12);
        /* numeros */
        x.textAlign='center';
        cols.forEach((c,j)=>{
          const v=r[c[1]];
          if(c[1]==='pts'){ x.font=FC(32,700); x.fillStyle='#f2c230'; x.fillText(String(v),xNum[j],y+14); }
          else if(c[1]==='dg'){ x.font=FSS(22,600);
            x.fillStyle=v>0?'#2fbdf0':v<0?'#ff8b83':'#e9f0fa';
            x.fillText((v>0?'+':'')+v,xNum[j],y+12); }
          else { x.font=FSS(22,500); x.fillStyle='#c9d6e8'; x.fillText(String(v),xNum[j],y+12); }
        });
        y+=62;
      });
    }
  });
}
/* ---------- modal Google Sheets ---------- */
async function recargar(){
  $('#app').innerHTML='<div class="card pad">Cargando datos…</div>';
  try{ await cargar(); toast('Datos actualizados'); }
  catch(e){ console.error(e); $('#app').innerHTML='<div class="card pad">No pude cargar los datos. '+esc(e.message)+'</div>'; return; }
  render();
}

/* ---------- init ---------- */
/* Tocar en cualquier parte de un campo de fecha u hora abre el selector,
   así no hay que apuntarle al iconito. */
document.addEventListener('click',e=>{
  const el=e.target;
  if(el&&el.tagName==='INPUT'&&(el.type==='date'||el.type==='time')&&el.showPicker){
    try{ el.showPicker(); }catch(err){ /* ya estaba abierto */ }
  }
});
$('#btnReload').onclick=recargar;
recargar();
</script>
