const FC  = (s,w) => (w||600)+' '+s+'px "Barlow Condensed",Arial,sans-serif';
const FSS = (s,w) => (w||500)+' '+s+'px Inter,Arial,sans-serif';

/* Dibuja el lienzo, el encabezado con el logo y descarga el PNG.
   dibujar(x, W, y0) pinta el contenido y devuelve nada.                      */
function exportarPNG(opt){
  const W=1080, R=2, H=opt.alto;
  const cv=document.createElement('canvas');
  cv.width=W*R; cv.height=H*R;
  const x=cv.getContext('2d');
  x.scale(R,R);

  const fondo = () => {
    x.fillStyle='#070b12'; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(47,189,240,.06)';
    for(let i=0;i<W;i+=68) x.fillRect(i,0,34,H);
    x.fillStyle='#111'; x.fillRect(0,0,W,186);
    x.strokeStyle='#2fbdf0'; x.lineWidth=4;
    x.beginPath(); x.moveTo(0,186); x.lineTo(W,186); x.stroke();
  };
  const cabecera = conLogo => {
    const X = conLogo?170:44;
    x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillStyle='#fff'; x.font=FC(58,700);
    x.fillText('COPA ',X,82);
    x.fillStyle='#f2c230';
    x.fillText('PALERMO',X+x.measureText('COPA ').width,82);
    x.fillStyle='#8ea0ba'; x.font=FSS(21,500);
    x.fillText(S.cfg.SEDE||'COMPLEJO DEPORTIVO VELEZ AUTO',X,118);
    x.fillStyle='#2fbdf0'; x.font=FC(30,700);
    x.fillText(String(opt.sub||'').toUpperCase(),X,160);
  };
  const pie = txt => {
    x.fillStyle='#8ea0ba'; x.font=FSS(16,500); x.textAlign='center';
    x.fillText(txt,W/2,H-24);
  };
  const bajar = () => {
    try{
      const a=document.createElement('a');
      a.href=cv.toDataURL('image/png');
      a.download=opt.nombre||'copa-palermo.png';
      a.click();
      toast('Imagen descargada ✔');
    }catch(e){ toast('No pude generar la imagen'); }
  };
  const contenido = conLogo => {
    cabecera(conLogo);
    opt.dibujar(x,W,232);
    if(!opt.sinPie)
      pie('Generado el '+new Date().toLocaleDateString('es-EC',{day:'2-digit',month:'long',year:'numeric'})+
          (opt.pie? '  ·  '+opt.pie : ''));
  };

  const img=new Image();
  img.onload=()=>{
    fondo();
    x.save();
    x.beginPath(); x.arc(96,93,54,0,Math.PI*2); x.closePath(); x.clip();
    x.drawImage(img,42,39,108,108);
    x.restore();
    x.strokeStyle='#2fbdf0'; x.lineWidth=3;
    x.beginPath(); x.arc(96,93,54,0,Math.PI*2); x.stroke();
    contenido(true);
    try{ cv.toDataURL('image/png'); bajar(); }
    catch(e){                       /* abierto con doble clic: el logo ensucia el canvas */
      x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,cv.width,cv.height); x.scale(R,R);
      fondo(); contenido(false); bajar();
    }
  };
  img.onerror=()=>{ fondo(); contenido(false); bajar(); };
  img.src=LOGO_DATA;
}

/* rectángulo con esquinas redondeadas (con respaldo si el navegador es viejo) */
function rr(x,px,py,w,h,r){
  if(x.roundRect){ x.beginPath(); x.roundRect(px,py,w,h,r); x.fill(); return; }
  x.beginPath();
  x.moveTo(px+r,py); x.lineTo(px+w-r,py); x.quadraticCurveTo(px+w,py,px+w,py+r);
  x.lineTo(px+w,py+h-r); x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
  x.lineTo(px+r,py+h); x.quadraticCurveTo(px,py+h,px,py+h-r);
  x.lineTo(px,py+r); x.quadraticCurveTo(px,py,px+r,py); x.closePath(); x.fill();
}

/* ---------- imagen del calendario ---------- */
function descargarImagen(){
  const cal=S.calendario;
  if(!cal||!cal.keys.length){ toast('No hay partidos para exportar'); return; }
  const P=40, HJ=82, HP=92;                 /* alto del título de jornada y de cada partido */
  /* el contenido arranca en 208; cada bloque = título + partidos, y 8px entre bloques */
  const alto = 208 + cal.keys.reduce((s,k)=>s+HJ+cal.grupos[k].length*HP, 0)
    + 8*(cal.keys.length-1) + 12;
  const sub=[];
  if(S.filtros.cjor) sub.push('Jornada '+S.filtros.cjor);
  if(S.filtros.ccat) sub.push(S.filtros.ccat);
  if(S.filtros.cdia&&S.filtros.cdia!=='SIN FECHA') sub.push(fechaTxt(S.filtros.cdia));
  if(S.filtros.ceq) sub.push(corto(S.filtros.ceq));

  exportarPNG({
    alto, nombre:'calendario-copa-mama-julia.png', sinPie:true,
    sub: sub.join('  ·  ')||'Calendario completo',
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      let y=y0-12;
      cal.keys.forEach(k=>{
        /* ---- título de la jornada (un bloque por día) ---- */
        const m=(cal.meta&&cal.meta[k])||{titulo:k,fecha:''};
        x.fillStyle='#162133'; rr(x,P,y,ancho,58,12);
        x.fillStyle='#f2c230'; rr(x,P,y+12,5,34,3);
        x.fillStyle='#f2c230'; x.font=FC(32,700); x.textAlign='left'; x.textBaseline='middle';
        x.fillText(m.titulo,P+22,y+30);
        const g=cal.grupos[k];
        if(has(m.fecha)){
          x.font=FSS(20,700); x.textAlign='right';
          x.fillStyle='#e9f0fa'; x.fillText(fechaTxt(m.fecha).toUpperCase(),W-P-22,y+30);
        }
        y+=HJ;

        /* ---- partidos ---- */
        g.forEach(p=>{
          x.fillStyle='#121b2b'; rr(x,P,y,ancho,80,12);
          const cy=y+40;
          x.textBaseline='middle';

          if(p.jugado){
            /* marcador */
            x.fillStyle='#060a11'; rr(x,W/2-70,cy-27,140,54,10);
            x.fillStyle='#fff'; x.font=FC(40,700); x.textAlign='center';
            x.fillText(p.gl+' - '+p.gv,W/2,cy+2);
          } else if(has(p.hora)){
            /* hora en pastilla verde, con AM/PM */
            const t=hora12(p.hora), part=t.split(' ');
            x.font=FC(34,700);
            const wNum=x.measureText(part[0]).width;
            x.font=FC(20,700);
            const wAp=x.measureText(part[1]||'').width;
            const wTot=wNum+wAp+14, px=W/2-(wTot+40)/2;
            x.fillStyle='#2fbdf0'; rr(x,px,cy-25,wTot+40,50,25);
            x.fillStyle='#031622'; x.textAlign='left';
            x.font=FC(34,700); x.fillText(part[0],px+20,cy+2);
            x.font=FC(20,700); x.fillText(part[1]||'',px+20+wNum+8,cy+3);
          } else {
            x.fillStyle='#243049'; rr(x,W/2-32,cy-22,64,44,22);
            x.fillStyle='#8ea0ba'; x.font=FC(24,700); x.textAlign='center';
            x.fillText('VS',W/2,cy+1);
          }

          /* equipos */
          x.font=FSS(25,700);
          x.fillStyle=p.jugado&&p.gl>p.gv?'#2fbdf0':'#e9f0fa';
          x.textAlign='right'; x.fillText(corto(p.local),W/2-108,cy);
          x.fillStyle=p.jugado&&p.gv>p.gl?'#2fbdf0':'#e9f0fa';
          x.textAlign='left'; x.fillText(corto(p.visita),W/2+108,cy);
          y+=HP;
        });
        y+=8;
      });
      x.textBaseline='alphabetic';
    }
  });
}

/* ---------- imagen de la tabla de goleadores ---------- */
function imagenGoleadores(clave){
  const L = clave==='HOMBRES' ? goleadores(null).filter(g=>g.categoria!=='FEMENINO')
          : clave==='FEMENINO' ? goleadores('FEMENINO')
          : goleadores(clave);
  if(!L.length){ toast('No hay goleadores para exportar'); return; }
  const top=L.slice(0,8), P=40, HF=62;
  const titulo = clave==='HOMBRES'?'Copa Palermo' : clave;
  const alto = 208 + 54 + top.length*HF + 20;

  exportarPNG({
    alto, nombre:'goleadores-'+titulo.toLowerCase().replace(/ /g,'-')+'.png', sinPie:true,
    sub:'Goleadores · '+titulo+(L.length>top.length?'  ·  top 8':''),
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      let y=y0-12;
      /* encabezado */
      x.fillStyle='#162133'; rr(x,P,y,ancho,50,12);
      x.fillStyle='#8ea0ba'; x.font=FC(22,600); x.textBaseline='middle';
      x.textAlign='left'; x.fillText('JUGADOR',P+70,y+25);
      x.textAlign='right'; x.fillText('EQUIPO',ancho-110,y+25);
      x.fillStyle='#f2c230'; x.textAlign='center'; x.fillText('GOLES',W-P-52,y+25);
      y+=54;

      top.forEach((g,i)=>{
        const podio=i<3;
        x.fillStyle=podio?'#122035':'#121b2b'; rr(x,P,y,ancho,54,10);
        if(podio){ x.fillStyle='#2fbdf0'; rr(x,P,y+10,5,34,3); }
        const cy=y+27;
        /* puesto */
        x.textAlign='center'; x.font=FC(28,700);
        x.fillStyle=podio?'#2fbdf0':'#6a7a93';
        x.fillText(String(i+1),P+36,cy+1);
        /* jugador */
        x.textAlign='left'; x.font=FSS(24,700); x.fillStyle='#fff';
        x.fillText(g.jugador,P+70,cy);
        /* equipo */
        x.textAlign='right'; x.font=FSS(19,500); x.fillStyle='#8ea0ba';
        x.fillText(corto(g.equipo),ancho-110,cy);
        /* goles en pastilla */
        x.fillStyle='#f2c230'; rr(x,W-P-84,cy-20,64,40,20);
        x.fillStyle='#2a2000'; x.font=FC(28,700); x.textAlign='center';
        x.fillText(String(g.goles),W-P-52,cy+1);
        y+=HF;
      });
      x.textBaseline='alphabetic';
    }
  });
}

/* ---------- imagen de la tabla de posiciones ---------- */
function imagenPosiciones(cat){
  const t=tabla(cat), n=clasN(cat), P=44;
  if(!t.length){ toast('No hay equipos'); return; }
  const alto = 232 + 54 + t.length*62 + 46;
  /* columnas: PJ PG PE PP GF GC DG PTS */
  const cols=[['PJ','pj'],['PG','pg'],['PE','pe'],['PP','pp'],['GF','gf'],['GC','gc'],['DG','dg'],['PTS','pts']];
  exportarPNG({
    alto, nombre:'posiciones-'+cat.toLowerCase().replace(/ /g,'-')+'.png',
    sub:'Tabla de posiciones  ·  '+cat,
    dibujar:(x,W,y0)=>{
      const ancho=W-P*2;
      const xNum=[];                         /* centro de cada columna numerica */
      const wNum=64, wPts=84;
      let der=P+ancho-18;
      /* de derecha a izquierda: PTS mas ancho */
      for(let i=cols.length-1;i>=0;i--){
        const w=(i===cols.length-1)?wPts:wNum;
        der-=w; xNum[i]=der+w/2;
      }
      /* encabezado */
      x.fillStyle='#162133'; x.fillRect(P,y0-30,ancho,52);
      x.fillStyle='#8ea0ba'; x.font=FC(22,600);
      x.textAlign='left'; x.fillText('EQUIPO',P+64,y0+4);
      x.textAlign='center';
      cols.forEach((c,i)=>{
        x.fillStyle=i===cols.length-1?'#f2c230':'#8ea0ba';
        x.fillText(c[0],xNum[i],y0+4);
      });
      let y=y0+54;
      t.forEach((r,i)=>{
        const clas=i<n;
        x.fillStyle=clas?'#122035':'#0f1724'; x.fillRect(P,y-24,ancho,58);
        if(clas){ x.fillStyle='#2fbdf0'; x.fillRect(P,y-24,5,58); }
        /* puesto */
        x.textAlign='center'; x.font=FC(28,700);
        x.fillStyle=clas?'#2fbdf0':'#6a7a93';
        x.fillText(String(i+1),P+34,y+12);
        /* equipo */
        x.textAlign='left'; x.font=FSS(24,600); x.fillStyle='#fff';
        x.fillText(corto(r.equipo),P+64,y+12);
        /* numeros */
        x.textAlign='center';
        cols.forEach((c,j)=>{
          const v=r[c[1]];
          if(c[1]==='pts'){ x.font=FC(32,700); x.fillStyle='#f2c230'; x.fillText(String(v),xNum[j],y+14); }
          else if(c[1]==='dg'){ x.font=FSS(22,600);
            x.fillStyle=v>0?'#2fbdf0':v<0?'#ff8b83':'#e9f0fa';
            x.fillText((v>0?'+':'')+v,xNum[j],y+12); }
          else { x.font=FSS(22,500); x.fillStyle='#c9d6e8'; x.fillText(String(v),xNum[j],y+12); }
        });
        y+=62;
      });
    }
  });
}
/* ---------- modal Google Sheets ---------- */
async function recargar(){
  $('#app').innerHTML='<div class="card pad">Cargando datos…</div>';
  try{ await cargar(); toast('Datos actualizados'); }
  catch(e){ console.error(e); $('#app').innerHTML='<div class="card pad">No pude cargar los datos. '+esc(e.message)+'</div>'; return; }
  render();
}

   así no hay que apuntarle al iconito. */
document.addEventListener('click',e=>{
  const el=e.target;
  if(el&&el.tagName==='INPUT'&&(el.type==='date'||el.type==='time')&&el.showPicker){
    try{ el.showPicker(); }catch(err){ /* ya estaba abierto */ }
  }
});

recargar();
